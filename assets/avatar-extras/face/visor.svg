    <linearGradient id="reflect" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fe0ff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#3fe0ff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ff9ee8" stop-opacity="0.35"/>
