<!-- Hat slot: 220x150. Crown centre (110, 44), head spans x 23.5 to 196.5.
     Obsidian demon horns on a thin iron circlet with a glowing gem. -->
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="150" viewBox="0 0 220 150">
  <defs>
    <linearGradient id="obsidian" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2a0b12"/>
      <stop offset="0.6" stop-color="#6e1a26"/>
      <stop offset="1" stop-color="#b8323f"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#d9fbff"/>
      <stop offset="0.4" stop-color="#3fe0ff"/>
      <stop offset="1" stop-color="#0b5f7a"/>
    </radialGradient>
  </defs>
  <g>
    <!-- horns -->
    <path d="M62 92 C40 86 24 62 26 18 C40 52 52 70 76 82 Z" fill="url(#obsidian)"/>
    <path d="M158 92 C180 86 196 62 194 18 C180 52 168 70 144 82 Z" fill="url(#obsidian)"/>
    <path d="M34 30 C40 54 50 68 66 80" stroke="#e06b78" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M186 30 C180 54 170 68 154 80" stroke="#e06b78" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
    <!-- ridges -->
    <g stroke="#1a070b" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M40 60 Q48 66 56 70"/>
      <path d="M46 72 Q54 78 62 82"/>
      <path d="M180 60 Q172 66 164 70"/>
      <path d="M174 72 Q166 78 158 82"/>
    </g>
    <!-- circlet -->
    <path d="M36 98 Q110 76 184 98" stroke="#3a4150" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M36 98 Q110 76 184 98" stroke="#7d8798" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M110 74 L122 86 L110 98 L98 86 Z" fill="#c9953a"/>
    <path d="M110 77 L119 86 L110 95 L101 86 Z" fill="url(#gem)"/>
  </g>
</svg>
